<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry | BlueConnect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    nav {
      height: 70px;
      padding: 0 8%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #263249;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 30px;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 40px;
    }

    .bluetooth-icon {
      font-size: 55px;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #94a3b8;
      font-size: 17px;
    }

    .container {
      width: 84%;
      max-width: 750px;
      margin: auto;
      padding-bottom: 70px;
    }

    .form-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 15px;
      padding: 35px;
    }

    .form-box:hover {
      border-color: #38bdf8;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #38bdf8;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    select option {
      background: #0f172a;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #082f49;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }

    #successMessage {
      display: none;
      margin-top: 20px;
      text-align: center;
      color: #86efac;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      border-top: 1px solid #263249;
    }

    @media (max-width: 700px) {

      nav {
        padding: 0 5%;
      }

      nav a {
        margin-left: 12px;
        font-size: 13px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .form-box {
        padding: 25px;
      }
    }
  </style>

</head>

<body>

  <nav>

```
<div class="logo">
  Blue<span>Connect</span>
</div>

<div>
  <a href="index.html">Home</a>
  <a href="about.html">About Us</a>
  <a href="enquiry.html">Enquiry</a>
</div>
```

  </nav>

  <section class="hero">

```
<div class="bluetooth-icon">ᛒ</div>

<h1>Contact Us</h1>

<p>
  Have a question? Send us your enquiry.
</p>
```

  </section>

  <main class="container">

```
<div class="form-box">

  <form id="enquiryForm">

    <div class="form-row">

      <div class="form-group">

        <label for="name">Full Name</label>

        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
        >

      </div>


      <div class="form-group">

        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>

    </div>


    <div class="form-row">

      <div class="form-group">

        <label for="phone">Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter phone number"
        >

      </div>


      <div class="form-group">

        <label for="type">Enquiry Type</label>

        <select id="type" required>

          <option value="">Select enquiry type</option>
          <option>Bluetooth Device Issue</option>
          <option>Connection Problem</option>
          <option>Technical Support</option>
          <option>Business Enquiry</option>
          <option>Other</option>

        </select>

      </div>

    </div>


    <div class="form-group">

      <label for="message">Your Message</label>

      <textarea
        id="message"
        placeholder="Write your enquiry..."
        required
      ></textarea>

    </div>


    <button type="submit" class="submit-btn">
      Send Enquiry
    </button>


    <div id="successMessage">
      ✓ Your enquiry has been submitted successfully!
    </div>

  </form>

</div>
```

  </main>

  <footer>
    © 2026 BlueConnect • Bluetooth Device Manager
  </footer>

  <script>

    document
      .getElementById("enquiryForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        document.getElementById("successMessage").style.display = "block";

        this.reset();

      });

  </script>

</body>
</html>
