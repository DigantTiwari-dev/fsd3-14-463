<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AirTag Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
        }

        .status {
            color: #34c759;
            font-weight: bold;
        }

        .top-section {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .airtag-card {
            flex: 1;
            min-width: 250px;
            background: #f5f5f7;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        .airtag {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: auto;
            margin-bottom: 25px;

            background: radial-gradient(
                circle at 30% 30%,
                white,
                #d1d1d1,
                #777
            );

            box-shadow:
                8px 8px 20px rgba(0, 0, 0, 0.3),
                -5px -5px 15px white;
        }

        .airtag h2 {
            margin-top: 10px;
        }

        .map {
            flex: 2;
            min-width: 300px;
            height: 350px;

            background:
                linear-gradient(
                    rgba(255,255,255,0.5),
                    rgba(255,255,255,0.5)
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    #d9d9d9 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    #d9d9d9 51px
                );

            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .location {
            position: absolute;
            top: 45%;
            left: 48%;

            width: 25px;
            height: 25px;

            background: #007aff;
            border: 5px solid white;
            border-radius: 50%;

            box-shadow: 0 0 0 10px rgba(0, 122, 255, 0.2);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 16px;
            border-radius: 14px;

            background: #007aff;
            color: white;

            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #005ecb;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .info-box {
            background: #f5f5f7;
            padding: 20px;
            border-radius: 15px;
        }

        .info-box p {
            color: #666;
            margin-top: 8px;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            text-align: center;

            background: #e8f5e9;
            color: #248a3d;

            border-radius: 12px;

            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            h1 {
                font-size: 26px;
            }

            .map {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>AirTag</h1>
                <p class="status">● Connected</p>
            </div>

            <p>Last updated: Just now</p>
        </header>


        <div class="top-section">

            <div class="airtag-card">

                <div class="airtag"></div>

                <h2 id="tagName">My Keys</h2>

                <p>AirTag</p>

            </div>


            <div class="map">

                <div class="location"></div>

            </div>

        </div>


        <div class="controls">

            <button onclick="findNearby()">
                📍 Find Nearby
            </button>

            <button onclick="playSound()">
                🔊 Play Sound
            </button>

            <button onclick="getDirections()">
                🧭 Directions
            </button>

        </div>


        <div class="message" id="message"></div>


        <div class="info">

            <div class="info-box">
                <strong>Location</strong>
                <p id="locationText">Home</p>
            </div>


            <div class="info-box">
                <strong>Distance</strong>
                <p id="distanceText">12 meters away</p>
            </div>


            <div class="info-box">
                <strong>Battery</strong>
                <p>🔋 85%</p>
            </div>


            <div class="info-box">
                <strong>Last Seen</strong>
                <p>Just now</p>
            </div>

        </div>

    </div>


    <script>

        function showMessage(text) {
            const message = document.getElementById("message");

            message.innerText = text;

            message.style.display = "block";

            setTimeout(function () {
                message.style.display = "none";
            }, 3000);
        }


        function findNearby() {

            const distance = Math.floor(Math.random() * 20) + 1;

            document.getElementById("distanceText").innerText =
                distance + " meters away";

            showMessage("🔍 Searching for your AirTag...");
        }


        function playSound() {

            showMessage("🔊 Playing sound on My Keys!");

        }


        function getDirections() {

            document.getElementById("locationText").innerText =
                "Navigation Started";

            showMessage("🧭 Getting directions to your AirTag...");
        }

    </script>

</body>
</html>
